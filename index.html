<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <div class="header">
        <h1>LIBRARY</h1>
        <button class="newBookBtn">New Book</button>
        <dialog id="addBookModal" closedby="any">
            <form action="" class="form">
                <div class="formDiv">
                    <div class="input">
                        <label for="titleInput" class="inputLabel">Title: </label>
                        <input type="text" name="titleInput" id="titleInput" required>
                    </div>
                    <div class="input">
                        <label for="authorInput" class="inputLabel">Author: </label>
                        <input type="text" name="authorInput" id="authorInput" required>
                    </div>
                    <div class="input">
                        <label for="descInput" class="inputLabel">Description: </label>
                        <input type="text" name="descInput" id="descInput" required>
                    </div>
                    <div class="checkmark">
                        <label for="hasReadInput" class="hasReadInput">Have you finished reading it? </label>
                        <input type="checkbox" name="hasReadInput" id="hasReadInput">
                    </div>
                </div>
                <input class="confirmBookBtn" type="submit"></input>
                <input class="cancelBtn" type="reset"></input>
            </form>
        </dialog>
    </div>
    <div class="books">
        <!-- <div class="bookCard">
            <h2 class="bookTitle">Title</h2>
            <h4 class="bookAuthor">Author</h4>
            <p class="bookDesc">Description Description Description </p>
            <div class="hasRead">✓</div>
            <button class="deleteCardBtn">Delete</button>
        </div>  -->

            <h2 class="bookTitle">Title</h2>
            <h4 class="bookAuthor">Author</h4>
            <p class="bookDesc">Description Description Description </p>
        </div> -->
    </div>
</body>
</html>
